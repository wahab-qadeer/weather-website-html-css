<!DOCTYPE html>
<html>
<head>
    <title>Weatherify</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <header>
    <nav>
        <div class="logo">Weatherify</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="radar.html">Earth</a>
            <a href="contact1.html">Contact</a>
        </div>
      </nav>
    </header>

    <section>
        <h1 class="headertext">Weatherify!!</h1>
        <p class="subtitle">Get accurate weather information for any city...</p>
    </section>

    <section>
        <div class="current-weather">
            <h2>📍 Current Weather - Rawalpindi</h2>
            <div class="current-box">
                <div class="temp-now">32°C</div>
                <div class="current-icon">☀️</div>
                <div class="current-details">
                    <p>Feels like: 34°C</p>
                    <p>Humidity: 45%</p>
                    <p>Wind: 12 km/h</p>
                </div>
            </div>
        </div>
    </section>

  
    <section>
        <div class="content">
            <h2>5-Day Forecast</h2>
            
            <div class="cards">
                <div class="card">
                    <p>Mon</p>
                    <div>☀️</div>
                    <p>32°C</p>
                </div>
                
                <div class="card">
                    <p>Tue</p>
                    <div>⛅</div>
                    <p>28°C</p>
                </div>
                
                <div class="card">
                    <p>Wed</p>
                    <div>🌧️</div>
                    <p>25°C</p>
                </div>
                
                <div class="card">
                    <p>Thu</p>
                    <div>☁️</div>
                    <p>27°C</p>
                </div>
                
                <div class="card">
                    <p>Fri</p>
                    <div>⛈️</div>
                    <p>30°C</p>
                </div>
            </div>
        </div>
    </section>


    <footer>
        <div class="footer">
            <p>© 2025 Weatherify</p>
        </div>
    </footer>

</body>
</html>
